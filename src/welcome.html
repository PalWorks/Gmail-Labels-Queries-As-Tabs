<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Welcome to Gmail Labels as Tabs</title>
        <link rel="stylesheet" href="css/onboarding.css" />
        <link rel="stylesheet" href="css/welcome.css" />
    </head>

    <body>
        <div class="container">
            <header class="welcome-head">
                <div class="logo-circle">
                    <svg viewBox="0 0 24 24" class="logo-icon" aria-hidden="true" focusable="false">
                        <path
                            d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"
                        />
                    </svg>
                </div>
                <h1>Gmail Labels &amp; Search Queries as Tabs</h1>
                <p class="subtitle">
                    A one-minute tour of what it does. You can come back to this any time from the extension&rsquo;s
                    toolbar menu.
                </p>
            </header>

            <!-- The wizard is mounted here by welcome.ts. Identical to the one
                 that appears over Gmail; only the surround differs. -->
            <main class="welcome-stage" id="welcome-stage"></main>

            <footer class="welcome-foot">
                <p>
                    Your tabs, labels and settings stay in your browser&rsquo;s own storage. The extension makes no
                    background network requests.
                </p>
            </footer>
        </div>
        <script src="js/welcome.js"></script>
    </body>
</html>
