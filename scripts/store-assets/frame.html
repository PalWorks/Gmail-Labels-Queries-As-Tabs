<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --blue: #1967d2;
    --blue-deep: #0b3d91;
    --ink: #10223f;
    --muted: #4a5a70;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: 'Noto Sans', Ubuntu, 'Liberation Sans', sans-serif;
    background: linear-gradient(160deg, #eef3fb 0%, #e3ecfa 55%, #dbe7f8 100%);
    display: flex; flex-direction: column; align-items: center;
  }
  body.dark {
    background: linear-gradient(160deg, #141a24 0%, #18202e 55%, #1b2432 100%);
    --ink: #eaf0f8; --muted: #a9b6c9;
  }
  header { width: 100%; padding: 52px 72px 0; }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--blue);
  }
  body.dark .kicker { color: #8ab4f8; }
  .kicker img { width: 30px; height: 30px; border-radius: 7px; }
  h1 { font-size: 50px; line-height: 1.1; color: var(--ink); margin-top: 18px; font-weight: 800; letter-spacing: -0.5px; }
  p.sub { font-size: 24px; color: var(--muted); margin-top: 14px; font-weight: 500; }
  .shot {
    margin-top: 40px; width: 1136px; height: 470px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 26px 60px rgba(12, 32, 66, 0.26), 0 2px 0 rgba(255,255,255,0.7) inset;
    border: 1px solid rgba(12, 32, 66, 0.12); background: #fff;
  }
  body.dark .shot { border-color: rgba(255,255,255,0.14); background: #1a1a2e; box-shadow: 0 26px 60px rgba(0,0,0,0.5); }
  .shot img { width: 1136px; display: block; }
</style>
</head>
<body>
  <header>
    <div class="kicker"><img id="logo"><span>Gmail Labels as Tabs</span></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="shot"><img id="shot"></div>
</body>
</html>
