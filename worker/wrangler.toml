name = "gmail-tabs-feedback"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   RESEND_API_KEY   sending-only Resend key
[vars]
FEEDBACK_FROM = "GmailLabelsAsTabs.Support@palworks.ai"
FEEDBACK_TO = "support@palworks.ai"

# Per-IP rate-limit counters only; no message content is ever stored.
# Create with: wrangler kv namespace create FEEDBACK_RATE_LIMIT
# [[kv_namespaces]]
# binding = "FEEDBACK_RATE_LIMIT"
# id = "<filled in at deploy time>"
