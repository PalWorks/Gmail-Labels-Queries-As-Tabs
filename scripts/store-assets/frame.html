<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700..800&family=Hanken+Grotesk:wght@400..600&family=Martian+Mono:wght@500&display=swap">
<!--
  The frame every store screenshot is composed in, in the website's design:
  the Gmail canvas, navy ink, and the feature named in a tab like the ones the
  product draws. build.mjs fills in the kicker, headline, subhead and capture.
  The capture runs off the bottom edge, so the product reads as a window you
  are looking into rather than a picture of one.
-->
<style>
  :root { --bg: #f2f5fa; --ink: #0e1726; --ink2: #445066; --accent: #1a5fd6; --line: #dde3ec; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { position: relative; font-family: 'Hanken Grotesk', Arial, sans-serif; }
  header { padding: 52px 72px 0; }
  .row { display: flex; align-items: center; gap: 14px; }
  .row img { width: 34px; height: 34px; border-radius: 8px; }
  .tab {
    display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 14px;
    border: 1px solid #c2d7fb; border-radius: 9px; background: #e8f0fe; color: #1967d2;
    font: 500 14px 'Martian Mono', ui-monospace, monospace; letter-spacing: 0.02em;
  }
  .tab::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 {
    margin-top: 22px; max-width: 1100px;
    font: 800 52px/1.04 'Schibsted Grotesk', Arial, sans-serif; letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p { margin-top: 14px; max-width: 1000px; font-size: 22px; line-height: 1.4; color: var(--ink2); }
  .shot {
    position: absolute; left: 72px; right: 72px; top: 292px; bottom: 0;
    overflow: hidden; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
    background: #fff; box-shadow: 0 -2px 0 rgba(255,255,255,.8) inset, 0 30px 70px -20px rgba(14, 23, 38, 0.35);
  }
  .shot img { display: block; width: 1136px; }
</style>
</head>
<body>
  <header>
    <div class="row"><img id="logo" alt=""><span class="tab" id="kicker"></span></div>
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </header>
  <div class="shot"><img id="shot" alt=""></div>
</body>
</html>
