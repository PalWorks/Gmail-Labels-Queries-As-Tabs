name: CI

# Manual trigger only. Actions minutes are spent deliberately, never on
# every push. Run from the Actions tab ("CI" -> "Run workflow"), or with
# `gh workflow run ci.yml --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'Optional note recorded with this run (for example: pre-merge gate for PR 3)'
        required: false
        default: ''

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      # A second pass, serially, under a different scheduler. The suite has
      # had two intermittent failures in its life and both only appeared when
      # timing shifted: fixed wall-clock sleeps losing a race under coverage,
      # and a first-test ts-jest compile overrunning the default timeout.
      # Neither reproduced on a normal parallel run, so one green run is not
      # evidence of a stable suite.
      - name: Re-run tests serially to catch order and timing flakes
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      # The relay is the only server-side code in the repo and has its own
      # tsconfig, so the extension's typecheck does not cover it.
      - name: Typecheck the feedback worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Verify no console.log in production bundle
        run: |
          count=$(grep -c 'console.log' dist/js/content.js 2>/dev/null || true)
          if [ "$count" -gt "0" ]; then
            echo "::error::Found $count console.log statements in production bundle"
            exit 1
          fi
          echo "Zero console.log in production bundle"

      # ------------------------------------------------------------------
      # Phase 5: CI/CD Hardening
      # ------------------------------------------------------------------

      # 5.1  Package and validate zip size
      - name: Package extension and validate zip
        run: |
          npm run package
          if [ ! -f extension.zip ]; then
            echo "::error::extension.zip was not created"
            exit 1
          fi
          size=$(stat --format=%s extension.zip)
          max=$((5 * 1024 * 1024))
          echo "extension.zip size: $size bytes"
          if [ "$size" -gt "$max" ]; then
            echo "::error::extension.zip exceeds 5MB Chrome Web Store limit ($size bytes)"
            exit 1
          fi
          echo "Zip size within 5MB limit"

      # 5.2  Manifest / package.json version parity
      - name: Verify version parity
        run: |
          manifest_ver=$(node -e "console.log(require('./manifest.json').version)")
          package_ver=$(node -e "console.log(require('./package.json').version)")
          echo "manifest.json version: $manifest_ver"
          echo "package.json  version: $package_ver"
          if [ "$manifest_ver" != "$package_ver" ]; then
            echo "::error::Version mismatch: manifest.json=$manifest_ver, package.json=$package_ver"
            exit 1
          fi
          echo "Versions match"

      # 5.3  Zero @ts-ignore in production source
      - name: Check for @ts-ignore in source
        run: |
          count=$(grep -r '@ts-ignore' src/ --include='*.ts' | wc -l)
          if [ "$count" -gt "0" ]; then
            echo "::error::Found $count @ts-ignore comment(s) in src/"
            grep -rn '@ts-ignore' src/ --include='*.ts'
            exit 1
          fi
          echo "Zero @ts-ignore in source"

      # 5.4  Verify dist folder contains all required files
      - name: Verify dist structure
        run: |
          required_files=(
            "dist/js/content.js"
            "dist/js/background.js"
            "dist/js/options.js"
            "dist/js/welcome.js"
            "dist/js/xhrInterceptor.js"
            "dist/css/toolbar.css"
            "dist/css/options.css"
            "dist/css/welcome.css"
            "dist/manifest.json"
            "dist/options.html"
            "dist/welcome.html"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt "0" ]; then
            echo "::error::$missing required file(s) missing from dist/"
            exit 1
          fi
          echo "All required files present in dist/"

      # 5.6  Nothing unreferenced ships to users
      #
      # Until 1.5.0 the package carried two promo tiles from src/icons/ that
      # the manifest never names and no page loads: 398 KB, 44% of the zip,
      # and the repo's own store-assets README calls them superseded mockups.
      # They shipped because copy-assets globbed the directory.
      - name: Verify dist/icons contains only icons the manifest declares
        run: |
          declared=$(node -e "
            const m = require('./dist/manifest.json');
            const names = new Set();
            for (const group of [m.icons, m.action && m.action.default_icon]) {
              for (const p of Object.values(group || {})) names.add(p.replace(/^icons\//, ''));
            }
            console.log([...names].join('\n'));
          ")
          echo "Declared: $(echo "$declared" | tr '\n' ' ')"
          status=0
          for f in dist/icons/*; do
            name=$(basename "$f")
            if ! echo "$declared" | grep -qx "$name"; then
              echo "::error::dist/icons/$name is not declared in manifest.json and would ship to users"
              status=1
            fi
          done
          exit $status

      # 5.7  The published privacy policy must describe the shipped extension
      #
      # The policy lives in another repository (PalWorks/Gmail-Labels-As-Tabs)
      # and deploys manually, so nothing in this build can keep it honest by
      # construction. It went four versions stale before anyone looked: it
      # claimed the extension transmits nothing, listed two of the four
      # permissions, and named neither the feedback relay nor the uninstall
      # form. This fetches what a Web Store reviewer would actually read.
      #
      # It fails the build when the live page is wrong or unreachable, which
      # is the right answer: we should not ship an extension whose declared
      # policy cannot be produced.
      - name: Verify the published privacy policy matches what the code does
        run: |
          site="https://palworks.github.io/Gmail-Labels-As-Tabs/"
          bundle=$(curl -sSfL --retry 3 --retry-delay 5 --max-time 30 "$site" \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::Could not find the site bundle at $site"
            exit 1
          fi
          curl -sSfL --retry 3 --retry-delay 5 --max-time 60 "$site$bundle" -o /tmp/site.js
          echo "Fetched $bundle ($(stat --format=%s /tmp/site.js) bytes)"

          # Every outbound host the extension can reach, and every permission
          # the manifest asks for, has to appear on that page.
          #
          # The permissions are read from the manifest rather than listed here.
          # A hardcoded list is how this check went stale the first time: it
          # named two of four permissions, and adding the fifth would have been
          # one more thing to remember. Now adding a permission fails this step
          # until the published policy names it.
          required="tally.so gmail-tabs-feedback.sunmooncal.workers.dev mail.google.com"
          required="$required $(node -p "require('./manifest.json').permissions.join(' ')")"
          # Microsoft Clarity runs on the site itself and must be disclosed too.
          required="$required Microsoft Clarity"
          status=0
          for term in $required; do
            if grep -qF "$term" /tmp/site.js; then
              echo "  ok       $term"
            else
              echo "::error::The published privacy policy never mentions '$term'"
              status=1
            fi
          done

          # A key must never be substituted into a static bundle.
          if grep -qE 'AIza[0-9A-Za-z_-]{30,}' /tmp/site.js; then
            echo "::error::The published site bundle contains a Google API key"
            status=1
          fi
          exit $status

      # ------------------------------------------------------------------
      # Artifact uploads
      # ------------------------------------------------------------------

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 7

      # 5.5  Upload extension.zip artifact
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
